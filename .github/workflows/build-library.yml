name: Build public domain library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python scripts/build_classics.py

      - run: |
          git config user.name 'bookverse-library[bot]'
          git config user.email 'bookverse-library[bot]@users.noreply.github.com'
          git add assets/books
          git diff --cached --quiet || git commit -m 'Add public domain editions'
          git push
